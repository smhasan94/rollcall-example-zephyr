# west spdx needs the build's metadata (zephyr.meta) for every image.
CONFIG_BUILD_OUTPUT_META=y

# Demo pull request: add Mbed TLS, so the rollcall comment shows the components it adds
# and any vulnerabilities that come with them.
CONFIG_MBEDTLS=y
# Zephyr v4.4.2 compiles Mbed TLS only with its PSA crypto core, which needs an entropy source.
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_ENTROPY_GENERATOR=y
